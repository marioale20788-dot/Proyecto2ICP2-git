<div class="container mt-5">
  <div class="row g-3">

    <form [formGroup]="valorABuscarForm" (ngSubmit)="buscarPorDpi()" class="row g-3 align-items-end">
      
      <div class="col-md-4">
        <label class="form-label fw-bold">DPI del Estudiante:</label>
        <input type="text" class="form-control" formControlName="valor" placeholder="Ingrese DPI a buscar" />
      </div>

      <div class="col-md-3">
        <label class="form-label fw-bold">Estado:</label>
        <select class="form-select" formControlName="estadoFiltro" (change)="buscarTodos()"> <option [ngValue]="true">Activos</option>
          <option [ngValue]="false">Inactivos</option>
        </select>
      </div>

      <div class="col-md-2">
        <button class="btn btn-dark w-100" type="submit">Buscar DPI</button>
      </div>

  

    </form>

    <div class="col-12 mt-4">
      <app-lista-estudiantes [estudiantes]="estudiantes()"></app-lista-estudiantes>

      @if (errorMensage()) {
        <div class="alert alert-danger alert-dismissible fade show my-3" role="alert">
          <strong>¡Error!</strong> {{ errorMensage() }}
          <button type="button" class="btn-close" (click)="errorMensage.set(null)"></button>
        </div>
      }

      @if (paginacionActiva) {
        <div class="d-flex justify-content-end align-items-center gap-2 my-3">
          <span class="me-2">Página <strong>{{ paginaActual }}</strong></span>

          <button 
            class="btn btn-outline-secondary btn-sm"
            (click)="paginaAnterior()" 
            [disabled]="paginaActual === 1">
            Anterior
          </button>

          <button 
            class="btn btn-dark btn-sm" 
            (click)="siguientePagina()" 
            [disabled]="estudiantes().length < 10">
            Siguiente
          </button>
        </div>
      }
    </div>

  </div>
</div>
