<div class="container justify-content-end mb-3">
  <a [routerLink]="['/Usuarios']" class="btn btn-outline-secondary">
    <i class="bi bi-arrow-left-square-fill me-1"></i>
    Ir a usuarios empleados
  </a>
</div>
<div class="container">
    <h1>Modificar usuario {{ idUsuario }}</h1>
    <div class="row">

        @if (!errorMensaje()) {
            @if (Usuario()) {

<app-form-usuario [modoEditar]="true" [usuarioAEditar]="Usuario()!" ></app-form-usuario>
            }
        
        }
        @else {

        <div class="alert alert-danger" role="alert">
            <div class="alert alert-danger alert-dismissible fade show my-3" role="alert">
        <strong>¡Error!</strong> {{ errorMensaje() }}
        <button type="button" class="btn-close" (click)="errorMensaje.set(null)"></button>
      </div>
        </div>
        }
    </div>
</div>
