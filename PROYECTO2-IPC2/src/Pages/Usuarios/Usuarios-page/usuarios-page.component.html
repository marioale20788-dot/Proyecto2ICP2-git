<div class="container mt-4">
  <h2 class="mb-4">Gestión de Usuarios</h2>

  <form   [formGroup]="filtroForm" (ngSubmit)="buscarUsuarios(true)" class="card card-body bg-light shadow-sm mb-4">
    <div class="row g-3 align-items-end">
      
  
      <div class="col-md-3">
        <label for="dpi" class="form-label fw-bold">Buscar por DPI:</label>
        <input type="text"id="dpi" class="form-control" formControlName="dpi" >
      </div>


      <div class="col-md-3">
        <label for="rol" class="form-label fw-bold">Filtrar por Rol:</label>
        <select id="rol" class="form-select" formControlName="rol">
          <option value="TODOS">-- Todos los Roles --</option>
          @for (rolKey of TipoUsuarioEnum | keyvalue; track rolKey.key) {
  @if (rolKey.value !== TipoUsuarioEnum.Estudiante) {
    <option [value]="rolKey.value">{{ rolKey.key }}</option>
  }
}
        </select>
      </div>


      <div class="col-md-3 d-flex align-items-center pb-2">
        <div class="form-check form-switch">
          <input  class="form-check-input" type="checkbox"  role="switch"   id="estadoSwitch"   formControlName="estado">
        <label class="form-check-label fw-bold ms-2" for="estadoSwitch">
  @if (filtroForm.get('estado')?.value) {
    <span class="text-success"><i class="bi bi-check-circle me-1"></i>Mostrar Activos</span>
  } @else {
    <span class="text-danger"><i class="bi bi-x-circle me-1"></i>Mostrar Inactivos</span>
  }
</label>
        </div>
      </div>

  
      <div class="col-md-3 d-flex gap-2">
        <button class="btn btn-dark w-100" type="submit"><i class="bi bi-search me-1"></i> Buscar
        </button>
        <button class="btn btn-outline-secondary" type="button" (click)="limpiarFiltros()">
          Limpiar
        </button>
      </div>

    </div>
  </form>

 
  <div class="col-12 mt-3">
    <app-lista-usuarios [listaUsuarios]="usuarios()"></app-lista-usuarios>
  </div>

 
  @if (errorMensage()) {
    <div class="alert alert-danger alert-dismissible fade show my-3" role="alert">
      <strong>¡Error!</strong> {{ errorMensage() }}
      <button type="button" class="btn-close" (click)="errorMensage.set(null)"></button>
    </div>
  }

  @if (paginacionActiva) {
    <div class="d-flex justify-content-end align-items-center gap-2 my-3">
      <span class="me-2">Página <strong>{{ paginaActual }}</strong></span>

      <button 
        class="btn btn-outline-secondary btn-sm"
        (click)="paginaAnterior()" 
        [disabled]="paginaActual === 1">
        Anterior
      </button>

      <button 
        class="btn btn-dark btn-sm" 
        (click)="siguientePagina()" 
        [disabled]="usuarios().length < 10">
        Siguiente
      </button>
    </div>
  }
</div>
