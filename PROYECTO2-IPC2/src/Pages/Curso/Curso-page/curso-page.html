<div class="container mt-5">
  <div class="row g-3">

    <form [formGroup]="valorABuscarForm" (ngSubmit)="buscarPorCodigoNombre()" class="row g-3 align-items-end">

      <div class="col-md-6">
        <label class="form-label fw-bold">Buscar por Código o Nombre:</label>
        <input type="text" class="form-control" formControlName="valor" />
      </div>

      <div class="col-md-3">
        <button class="btn btn-dark w-100" type="submit">Buscar</button>
      </div>

      <div class="col-md-3">
        <button class="btn btn-outline-secondary w-100" type="button" (click)="buscarTodos()">
          Buscar Todos
        </button>
      </div>
    </form>

    <div class="col-12 mt-4">
      <app-lista-cursos [cursos]="cursos()" (codigoCursoAEliminar)="eliminarCurso($event)"></app-lista-cursos>

      @if (codigoCursoAEliminar()) {
        <app-modal-confirmation [idAEliminar]="codigoCursoAEliminar()!" (ConfirmacionEliminar)="eliminar()"></app-modal-confirmation>
      }
      @if (errorMensage()) {
        <div class="alert alert-danger alert-dismissible fade show my-3" role="alert">
          <strong>¡Error!</strong> {{ errorMensage() }}
          <button type="button" class="btn-close" (click)="errorMensage.set(null)"></button>
        </div>
      }
      @if (eliminado()) {
        <div class="alert alert-success d-flex align-items-center my-3">
          <i class="bi bi-check-circle flex-shrink-0 me-2"></i>
          <div>
            Operación realizada con éxito.
            <button type="button" class="btn-close" (click)="eliminado.set(false)"></button>
          </div>
        </div>
      }
      @if (paginacionActiva) {
        <div class="d-flex justify-content-end align-items-center gap-2 my-3">
          <span class="me-2">Página <strong>{{ paginaActual }}</strong></span>

          <button 
            class="btn btn-outline-secondary btn-sm"
            (click)="paginaAnterior()" 
            [disabled]="paginaActual === 1">
            Anterior
          </button>

          <button 
            class="btn btn-dark btn-sm" 
            (click)="siguientePagina()" 
            [disabled]="cursos().length < 10">
            Siguiente
          </button>
        </div>
      }
    </div>

  </div>
</div>
