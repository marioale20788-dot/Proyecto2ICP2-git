<div class="container mt-5">
  <div class="row g-3">

    <form [formGroup]="valorABuscarForm" (ngSubmit)="buscar()" class="row g-3 align-items-end">

      <div class="col-md-3">
        <label class="form-label fw-bold">Estado Carrera:</label>
        <select class="form-select" formControlName="estado" (change)="cambiarEstadoFiltro()">
          <option [ngValue]="true">Activas</option>
          <option [ngValue]="false">Inactivas</option>
        </select>
      </div>

      <div class="col-md-4">
        <label class="form-label fw-bold">Buscar por ID o Nombre:</label>
        <input type="text" class="form-control" formControlName="valor"  />
      </div>

      <div class="col-md-2">
        <button class="btn btn-dark w-100" type="submit">Buscar</button>
      </div>

   
    </form>

    <div class="col-12 mt-4">
      <app-lista-carreras [carreras]="carreras()" (idCarreraAEliminar)="eliminarCarrera($event)"></app-lista-carreras>

      @if (idCarreraAeliminar()) {
        <app-modal-confirmation [idAEliminar]="idCarreraAeliminar()!" (ConfirmacionEliminar)="eliminar()"></app-modal-confirmation>
      }
      @if (errorMensage()) {
        <div class="alert alert-danger alert-dismissible fade show my-3" role="alert">
          <strong>¡Error!</strong> {{ errorMensage() }}
          <button type="button" class="btn-close" (click)="errorMensage.set(null)"></button>
        </div>
      }
      @if (eliminado()) {
        <div class="alert alert-success d-flex align-items-center my-3">
          <i class="bi bi-check-circle flex-shrink-0 me-2"></i>
          <div>
            Operación realizada con éxito.
            <button type="button" class="btn-close" (click)="eliminado.set(false)"></button>
          </div>
        </div>
      }
      @if (paginacionActiva) {
        <div class="d-flex justify-content-end align-items-center gap-2 my-3">
          <span class="me-2">Página <strong>{{ paginaActual }}</strong></span>

          <button 
            class="btn btn-outline-secondary btn-sm"
            (click)="paginaAnterior()" 
            [disabled]="paginaActual === 1">
            Anterior
          </button>

          <button 
            class="btn btn-dark btn-sm" 
            (click)="siguientePagina()" 
            [disabled]="carreras().length < 10">
            Siguiente
          </button>
        </div>
      }
    </div>

  </div>
</div>
