<div class="container mt-5">
  <div class="row g-3">

    <form [formGroup]="filtroForm" (ngSubmit)="buscarCurriculo()" class="row g-3 align-items-end">

      <div class="col-md-5">
        <label class="form-label fw-bold">Grado:</label>
        <select class="form-select" formControlName="idGrado">
          <option [ngValue]="null" disabled selected>Seleccione un grado...</option>
          @for (grado of grados(); track grado.idGrado) {
            <option [value]="grado.idGrado">{{ grado.nombreGrado }} ({{ grado.idNivel }})</option>
          }
        </select>
      </div>

      <div class="col-md-4">
        <label class="form-label fw-bold">Ciclo Lectivo:</label>
        <input type="number" class="form-control" formControlName="ciclo" />
      </div>

      <div class="col-md-3">
        <button class="btn btn-dark w-100" type="submit" [disabled]="filtroForm.invalid">
          Buscar Currículo
        </button>
      </div>

    </form>

    <div class="col-12 mt-4">
      <app-lista-curriculo [curriculoList]="curriculoList()" (idCurriculoAEliminar)="prepararEliminar($event)"></app-lista-curriculo>

      @if (idCurriculoAeliminar()) {
        <app-modal-confirmation [idAEliminar]="idCurriculoAeliminar()!" (ConfirmacionEliminar)="eliminar()"></app-modal-confirmation>
      }
      @if (errorMensage()) {
        <div class="alert alert-danger alert-dismissible fade show my-3" role="alert">
          <strong>¡Error!</strong> {{ errorMensage() }}
          <button type="button" class="btn-close" (click)="errorMensage.set(null)"></button>
        </div>
      }
      @if (eliminado()) {
        <div class="alert alert-success d-flex align-items-center my-3">
          <i class="bi bi-check-circle flex-shrink-0 me-2"></i>
          <div>
            Curso eliminado del currículo con éxito.
            <button type="button" class="btn-close" (click)="eliminado.set(false)"></button>
          </div>
        </div>
      }
    </div>

  </div>
</div>
