<div class="container mt-5">
  <div class="row g-3">

    
    <form [formGroup]="valorABuscarForm" (ngSubmit)="buscarPorEstudiante()" class="row g-3 align-items-end">
      <div class="col-md-6">
        <label class="form-label fw-bold">ID del Estudiante:</label>
        <input type="text" class="form-control" formControlName="valor" placeholder="Ingrese ID o Carné del estudiante..." />
      </div>

      <div class="col-md-3">
        <button class="btn btn-dark w-100" type="submit">Buscar por Estudiante</button>
      </div>

      <div class="col-md-3">
        <button class="btn btn-outline-secondary w-100" type="button" (click)="buscarTodas()">Buscar por Ciclo Actual</button>
      </div>
    </form>

    <div class="col-12 mt-4">

      <app-lista-inscripciones  [inscripciones]="inscripciones()"   (idInscripcionAEliminar)="seleccionarParaEliminar($event)"></app-lista-inscripciones>

     @if (inscripcionAEliminar()) {
        <app-modal-confirmation  [idAEliminar]="inscripcionAEliminar()!.idIncripcion"  (ConfirmacionEliminar)="eliminar()"></app-modal-confirmation>
      }
      
    
      @if (errorMensage()) {
        <div class="alert alert-danger alert-dismissible fade show my-3" role="alert">
          <strong>¡Error!</strong> {{ errorMensage() }}
          <button type="button" class="btn-close" (click)="errorMensage.set(null)"></button>
        </div>
      }

    
      @if (eliminado()) {
        <div class="alert alert-success d-flex align-items-center my-3" role="alert">
          <i class="bi bi-check-circle flex-shrink-0 me-2"></i>
          <div>Operación realizada con éxito.</div>
          <button type="button" class="btn-close ms-auto" (click)="eliminado.set(false)"></button>
        </div>
      }

    </div>

  </div>
</div>
