<div class="container justify-content-end mb-3">
  <a [routerLink]="['/Prestamos']" class="btn btn-outline-secondary">
    <i class="bi bi-arrow-left-square-fill me-1"></i>
    Ir a préstamos
  </a>
</div>

<div class="container">
  <h1>Procesar Devolución {{ codigoPrestamo }}</h1>
  <div class="row">
    @if (!errorMensaje()) {
      @if (prestamoDevolver()) {
        <app-devolver-prestamo [prestamo]="prestamoDevolver()!"></app-devolver-prestamo>
      }
    } @else {
      <div class="alert alert-danger alert-dismissible fade show my-3" role="alert">
        <strong>¡Error!</strong> {{ errorMensaje() }}
        <button type="button" class="btn-close" (click)="errorMensaje.set(null)"></button>
      </div>
    }
  </div>
</div>
