<div class="container mt-4">
  <div class="card shadow-sm border-0 rounded-3">
    <div class="card-body p-0 overflow-hidden">
      <div class="table-responsive">
        <table class="table table-hover table-striped align-middle mb-0">
          <thead class="table-dark text-uppercase small"> 
            <tr>
              <th class="py-3 px-4">ID Asignación</th>
              <th class="py-3 px-4">DPI / ID Docente</th>
              <th class="py-3 px-4">ID Sección</th>
              <th class="py-3 px-4">ID Currículo</th>
              <th class="py-3 px-4 text-center">Acciones</th>
            </tr>
          </thead>

          <tbody>
            @for (item of asignaciones; track item.idAsignacion) {
              <tr>
                <td class="py-3 px-4 fw-bold text-secondary">{{ item.idAsignacion }}</td>
                <td class="py-3 px-4 fw-bold text-secondary">{{ item.idUsuario }}</td>
                <td class="py-3 px-4 fw-bold text-secondary">{{ item.idSeccion }}</td>
                <td class="py-3 px-4 fw-bold text-secondary">{{ item.idCurriculo }}</td>

                <td class="py-3 px-4 text-center">
                  <button 
                    type="button" 
                    class="btn btn-danger btn-sm" 
                    data-bs-toggle="modal" 
                    data-bs-target="#deleteModal" 
                    (click)="eliminar(item.idAsignacion)" 
                    title="Eliminar Asignación"> 
                    <i class="bi bi-trash"></i> 
                  </button>
                </td>
              </tr>
            }
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>
