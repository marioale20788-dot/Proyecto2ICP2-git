<div class="container mt-4">
  <form [formGroup]="updateCicloForm" (ngSubmit)="accion()">
    <div class="card shadow-sm">
      
      <div class="card-header bg-black text-white p-3 d-flex justify-content-between align-items-center">
        <h5 class="mb-0">DETALLES CICLO LECTIVO</h5>
        
        @if (!modoEditar) {
          <div class="d-flex align-items-center gap-2">
            <label for="anio" class="col-form-label text-nowrap">Año:</label>
            <input type="number" class="form-control form-control-sm" name="anio" id="anio" formControlName="anio" />
          </div>
        } @else {
          <div>
            <span>Año: </span>
            <span class="badge bg-success fs-6">{{ cicloAEditar.anio }}</span>
            <input type="hidden" name="anio" id="anio" formControlName="anio" />
          </div>
        }
      </div>

      <div class="card-body">
        <div class="row g-3">
          
          <div class="col-md-6">
            <label for="fechaInicio" class="form-label fw-bold">Fecha de Inicio</label>
            <input type="date" class="form-control" name="fechaInicio" id="fechaInicio" formControlName="fechaInicio" />
          </div>

          <div class="col-md-6">
            <label for="fechaFinal" class="form-label fw-bold">Fecha Final</label>
            <input type="date" class="form-control" name="fechaFinal" id="fechaFinal" formControlName="fechaFinal" />
          </div>

          <div class="col-md-6">
            <label for="estado" class="form-label fw-bold">Estado</label>
            <select class="form-select" name="estado" id="estado" formControlName="estado">
              <option [ngValue]="true">Activo</option>
              <option [ngValue]="false">Inactivo</option>
            </select>
          </div>

        </div>
      </div>

      <div class="card-footer text-end p-3 bg-light">
        <button type="submit" class="btn btn-dark w-100" [disabled]="updateCicloForm.invalid">
          GUARDAR
        </button>
      </div>

    </div>
  </form>

  @if (operacionTerminada()) {
    <div class="alert alert-success alert-dismissible fade show my-3" role="alert">
      <strong>OPERACION REALIZADA</strong> 
      <button type="button" class="btn-close" (click)="operacionTerminada.set(false)"></button>
    </div>
  }
  @if(errorOperacion()){
    <div class="alert alert-danger alert-dismissible fade show my-3" role="alert">
      <strong>¡Error!</strong> {{ errorOperacion() }}
      <button type="button" class="btn-close" (click)="errorOperacion.set(null)"></button>
    </div>
  }
</div>
