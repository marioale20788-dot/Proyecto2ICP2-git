<div class="container mt-4">
  <div class="card shadow-sm border-0 rounded-3">
    <div class="card-body p-0 overflow-hidden">
      <div class="table-dark">
        <table class="table table-hover table-striped align-middle mb-0">
          <thead class="table-dark text-uppercase small"> 
            <tr>
              <th class="py-3 px-4">id libro</th>
              <th class="py-3 px-4">nombre libro</th>
              <th class="py-3 px-4">autor</th>
              <th class="py-3 px-4">editorial</th>
              <th class="py-3 px-4">cantidad</th>
              <th class="py-3 px-4">editar</th>
              <th class="py-3 px-4">Eliminar</th>
            </tr>
          </thead>

          <tbody>
            @for (libro of libros; track libro.idLibro) {
              <tr>
                <td class="py-3 px-4 fw-bold text-secondary">{{libro.idLibro}}</td>
                <td class="py-3 px-4 fw-bold text-secondary">{{libro.nombreLibro}}</td>
                <td class="py-3 px-4 fw-bold text-secondary">{{libro.autor}}</td>
                <td class="py-3 px-4 fw-bold text-secondary">{{libro.editorial}}</td>
                <td class="py-3 px-4 fw-bold text-secondary">{{libro.cantidad}}</td>
                <td class="py-3 px-4 fw-bold text-secondary">
                  <a [routerLink]="['/Libros/Update', libro.idLibro]" class="btn btn-close-white w-100 mb-2">EDITAR</a>
                </td>
                <td class="py-3 px-4 fw-bold text-secondary">
                  <button  type="button"     class="btn btn-danger"      data-bs-toggle="modal" data-bs-target="#deleteModal"   title="Delete event {{ libro.idLibro }}" 
                    (click)="eliminarLibro(libro.idLibro)">   <i class="bi bi-trash"></i> </button>
                </td>
              </tr>
            }
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>
