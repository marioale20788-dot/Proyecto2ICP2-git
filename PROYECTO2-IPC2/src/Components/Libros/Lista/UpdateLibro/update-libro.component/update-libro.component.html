<div class="container mt-4">
  <form [formGroup]="updateLibroForm" (ngSubmit)="accion()">
    <div class="card shadow-sm">
      
      <div class="card-header bg-black text-white p-3 d-flex justify-content-between align-items-center">
        <h5 class="mb-0">DETALLES LIBRO</h5>
        
        @if (!modoEditar) {
          <div class="d-flex align-items-center gap-2">
            <label for="idLibro" class="col-form-label text-nowrap">Id libro:</label>
            <input class="form-control form-control-sm" name="idLibro" id="idLibro" formControlName="idLibro" />
          </div>
        } @else {
  <div>
    <span>Id libro: </span>
    <span class="badge bg-success fs-6">{{ libroAEditar.idLibro }}</span>
    
  
    <input type="hidden"  name="idLibro" id="idLibro" formControlName="idLibro" />
  </div>
}
      </div>

      <div class="card-body">
        <div class="row g-3">
          
          <div class="col-md-6">
            <label for="nombreLibro" class="form-label fw-bold">Nombre del Libro</label>
            <input class="form-control" name="nombreLibro" id="nombreLibro" formControlName="nombreLibro" />
          </div>

          <div class="col-md-6">
            <label for="autor" class="form-label fw-bold">Autor</label>
            <input class="form-control" name="autor" id="autor" formControlName="autor" />
          </div>

          <div class="col-md-6">
            <label for="editorial" class="form-label fw-bold">Editorial</label>
            <input class="form-control" name="editorial" id="editorial" formControlName="editorial"  />
          </div>

          <div class="col-md-6">
            <label for="cantidad" class="form-label fw-bold">Cantidad</label>
            <input type="number" class="form-control" name="cantidad" id="cantidad" formControlName="cantidad" />
          </div>

        </div>
      </div>

      <div class="card-footer text-end p-3 bg-light">
        <button  type="submit"  class="btn btn-dark w-100" [disabled]="updateLibroForm.invalid">
          GUARDAR
        </button>
      </div>

    </div>
  </form>

  @if (operacionTerminada()) {
    <div class="alert alert-success alert-dismissible fade show my-3" role="alert">
        <strong>OPERACION REALIZADA</strong> 
        <button type="button" class="btn-close" (click)="operacionTerminada.set(false)"></button>
      </div>
  }
  @if(errorOperacion()){
       <div class="alert alert-danger alert-dismissible fade show my-3" role="alert">
        <strong>¡Error!</strong> {{ errorOperacion() }}
        <button type="button" class="btn-close" (click)="errorOperacion.set(null)"></button>
      </div>
  }
</div>
