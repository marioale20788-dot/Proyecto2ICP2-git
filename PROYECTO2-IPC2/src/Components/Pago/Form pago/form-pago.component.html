<h6 class="fw-bold mb-3">Registro de Pago Extra:</h6>

<form [formGroup]="pagoForm" (ngSubmit)="procesarPago()" class="row g-3 bg-light p-3 rounded">
  <div class="col-md-3">
    <label class="form-label fw-bold">Tipo Pago</label>
    <input class="form-control" value="EXTRA" disabled />
  </div>

  <div class="col-md-3">
    <label class="form-label fw-bold">Monto Extra</label>
    <input type="number" step="0.01" class="form-control" formControlName="monto" />
  </div>

  <div class="col-md-3">
    <label class="form-label fw-bold">Fecha de Pago</label>
    <input type="date" class="form-control" formControlName="fechaDePago" />
  </div>

  <div class="col-md-3">
    <label class="form-label fw-bold">ID Secretaría</label>
    <input class="form-control" formControlName="idSecretaria" />
  </div>

  <div class="col-12 text-end mt-3">
    <button type="submit" class="btn btn-success btn-lg w-100" [disabled]="pagoForm.invalid">
      REGISTRAR PAGO EXTRA Y GENERAR COMPROBANTE
    </button>
  </div>
</form>

@if (operacionTerminada()) {
  <div class="alert alert-success alert-dismissible fade show my-3" role="alert">
    <strong>OPERACIÓN REALIZADA</strong> 
    <button type="button" class="btn-close" (click)="operacionTerminada.set(false)"></button>
  </div>
}

@if (errorOperacion()) {
  <div class="alert alert-danger alert-dismissible fade show my-3" role="alert">
    <strong>¡Error!</strong> {{ errorOperacion() }}
    <button type="button" class="btn-close" (click)="errorOperacion.set(null)"></button>
  </div>
}
