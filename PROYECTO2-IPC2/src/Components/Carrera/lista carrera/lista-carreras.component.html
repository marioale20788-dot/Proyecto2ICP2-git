<div class="container mt-4">
  <div class="card shadow-sm border-0 rounded-3">
    <div class="card-body p-0 overflow-hidden">
      <div class="table-responsive">
        <table class="table table-hover table-striped align-middle mb-0">
          <thead class="table-dark text-uppercase small"> 
            <tr>
              <th class="py-3 px-4">ID Carrera</th>
              <th class="py-3 px-4">Nombre</th>
              <th class="py-3 px-4">Estado</th>
              <th class="py-3 px-4">Editar</th>
              <th class="py-3 px-4">Borrar</th>
            </tr>
          </thead>

          <tbody>
            @for (carrera of carreras; track carrera.idCarrera) {
              <tr>
                <td class="py-3 px-4 fw-bold text-secondary">{{ carrera.idCarrera }}</td>
                <td class="py-3 px-4 fw-bold text-secondary">{{ carrera.nombre }}</td>
                <td class="py-3 px-4"> {{ carrera.estado ? 'Activo' : 'Inactivo' }} </td>
                
                <td class="py-3 px-4">
                  <a [routerLink]="['/Carrera/Editar', carrera.idCarrera]"  class="btn btn-close-white w-100 mb-2"     title="Editar {{ carrera.idCarrera }}">   EDITAR   </a>
                </td>

                <td class="py-3 px-4">
                  <button type="button" class="btn btn-danger btn-sm" data-bs-toggle="modal" data-bs-target="#deleteModal" title="Eliminar {{ carrera.idCarrera }}" 
                    (click)="eliminarCarrera(carrera.idCarrera)"> 
                    <i class="bi bi-trash"></i> 
                  </button>
                </td>
              </tr>
            }
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>
