<div class="container mt-4">
  <div class="card shadow-sm border-0 rounded-3">
    <div class="card-body p-0 overflow-hidden">
      <div class="table-responsive">
        <table class="table table-hover table-striped align-middle mb-0">
          <thead class="table-dark text-uppercase small"> 
            <tr>
              <th class="py-3 px-4">ID Sección</th>
              <th class="py-3 px-4">Sección</th>
              <th class="py-3 px-4">ID Grado</th>
              <th class="py-3 px-4 text-center">Editar</th>
              <th class="py-3 px-4 text-center">Borrar</th>
            </tr>
          </thead>

          <tbody>
            @for (seccion of secciones; track seccion.idSeccion) {
              <tr>
                <td class="py-3 px-4 fw-bold text-secondary">{{ seccion.idSeccion }}</td>
                <td class="py-3 px-4 fw-bold text-secondary">{{ seccion.nombreSeccion }}</td>
                <td class="py-3 px-4 fw-bold text-secondary">{{ seccion.idGrado }}</td>

                <td class="py-3 px-4 text-center">
                  <a class="btn btn-close-white w-100 mb-2" [routerLink]="['/Seccion/Editar', seccion.idSeccion]" 
                     title="Editar {{ seccion.idSeccion }}"> EDITAR
                  </a>
                </td>

                <td class="py-3 px-4 text-center">
                  <button type="button" class="btn btn-danger btn-sm" data-bs-toggle="modal" data-bs-target="#deleteModal" title="Eliminar {{ seccion.idSeccion }}" 
                    (click)="eliminarSeccion(seccion.idSeccion)"> 
                    <i class="bi bi-trash"></i> 
                  </button>
                </td>
              </tr>
            }
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>
