<div class="container mt-4">
  <div class="card shadow-sm border-0 rounded-3 mb-4">
    <div class="card-header bg-black text-white p-3 d-flex justify-content-between align-items-center">
      <h5 class="mb-0 fs-6">NOTAS FINALES - CICLO {{ cicloActual() }}</h5>
      
      <div class="d-flex align-items-center gap-2">
        <label for="cicloInput" class="text-white small text-nowrap">Ciclo Lectivo:</label>
        <input   id="cicloInput"   type="number"      class="form-control form-control-sm text-center"     style="width: 100px;"     [value]="cicloActual()"    (change)="cambiarCiclo($event)" />
      </div>
    </div>

    <div class="card-body p-0 overflow-hidden">
      <table class="table table-hover align-middle mb-0">
        <thead class="table-dark text-uppercase small">
          <tr>
            <th class="py-3 px-4">Código</th>
            <th class="py-3 px-4">Curso</th>
            <th class="py-3 px-4 text-center">Nota Final</th>
            <th class="py-3 px-4 text-center">Estado</th>
          </tr>
        </thead>
        <tbody>
          @for (nota of notas(); track nota.idNota) {
            <tr>
              <td class="py-3 px-4 text-secondary fw-bold">{{ nota.codigoCurso }}</td>
              <td class="py-3 px-4 fw-bold text-secondary">{{ nota.nombreCurso }}</td>
              <td class="py-3 px-4 text-center fs-6 fw-bold text-secondary">{{ nota.notaFinal }}</td>
              <td class="py-3 px-4 text-center">   {{ nota.notaFinal >= 61 ? 'APROBADO' : 'REPROBADO' }}   </td>
            </tr>
          } @empty {
            <tr>
              <td colspan="4" class="text-center py-4 text-muted">No se encontraron registros de notas.</td>
            </tr>
          }
        </tbody>
      </table>
    </div>
  </div>
</div>
